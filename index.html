<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weekly Bible Study</title>
<style>
:root{color-scheme:light;--ink:#24342e;--muted:#64736a;--green:#315c49;--paper:#f6f5ef;--line:#dce2d9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.65 system-ui,sans-serif}header{background:#244638;color:white;padding:12px 24px}.top{max-width:1140px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font:500 25px/1.2 Georgia,serif;margin:0}h1 a{color:inherit;text-decoration:none}.menu{display:none;background:transparent;border:1px solid #a5b9ad;border-radius:6px;color:white;padding:8px;cursor:pointer;align-items:center;gap:8px;font:inherit}.layout{max-width:1140px;margin:auto;padding:24px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;align-items:start}nav{border-right:1px solid var(--line);padding-right:16px}nav h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}nav a{display:block;text-decoration:none;color:var(--ink);padding:10px 12px;border-radius:7px;margin:4px 0;line-height:1.35}nav a:hover{background:#e9ede5}nav a[aria-current="page"]{background:#dce9df;color:#244638;font-weight:600}.nav-date{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:28px;margin:0}h3{font:500 clamp(26px,4vw,36px)/1.2 Georgia,serif;margin:8px 0 16px}h4{margin:24px 0 6px}p{margin:8px 0 14px}.meta{font-size:14px;color:var(--muted)}a{color:var(--green)}ol{padding-left:25px}li{padding-left:4px;margin:14px 0}ol ol{list-style-type:lower-alpha}ol ol li{margin:8px 0}footer{max-width:1140px;margin:auto;padding:0 24px 24px;color:var(--muted);font-size:13px}[hidden]{display:none!important}:focus-visible{outline:2px solid #578d70;outline-offset:3px}
@media(max-width:760px){header{padding:12px 16px}h1{font-size:22px}.menu{display:flex}.layout{display:block;padding:12px 12px 24px}nav{display:none;border:1px solid var(--line);border-radius:10px;background:white;padding:12px;margin-bottom:12px}nav.open{display:block}.card{padding:18px}footer{padding:0 16px 20px}}
@media print{header,nav,footer{display:none}.layout{display:block;padding:0}.card{border:0;padding:0}body{background:white}}
.version-picker{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin:0 0 12px;font-size:14px;color:var(--muted)}.version-picker select{font:inherit;color:var(--ink);background:white;border:1px solid #b8c6bc;border-radius:6px;padding:7px 10px;cursor:pointer}@media print{.version-picker{display:none}}
</style></head><body><header><div class="top"><h1><a href="./">Weekly Bible Study</a></h1><button class="menu" id="menu" type="button" aria-controls="study-nav" aria-expanded="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg><span>Studies</span></button></div></header><div class="layout"><nav id="study-nav" aria-label="Study archive"><h2>All studies</h2><div id="study-list"></div></nav><main id="main"><div class="version-picker"><label for="bible-version">Bible version</label><select id="bible-version"><option>NIV</option><option>NLT</option><option>ESV</option><option>NKJV</option></select></div><div id="current"></div><p id="error" role="status">Loading study information…</p></main></div><footer>Weekly Bible Study</footer>
<script>
const el=(tag,txt,cls)=>{const e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e};
const format=(date,opts)=>new Intl.DateTimeFormat('en-CA',opts||{year:'numeric',month:'long',day:'numeric',timeZone:'UTC'}).format(new Date(date+'T00:00:00Z'));
const versions={NIV:111,NLT:116,ESV:59,NKJV:114};
const versionSelect=document.getElementById('bible-version');
try{const saved=localStorage.getItem('smallgroup-bible-version');if(Object.hasOwn(versions,saved))versionSelect.value=saved}catch{}
function versionedUrl(raw){const u=new URL(raw);const version=versionSelect.value;if(['bible.com','www.bible.com'].includes(u.hostname)){u.pathname=u.pathname.replace(/^\/bible\/\d+\//,'/bible/'+versions[version]+'/').replace(/\.(NIV|NLT|ESV|NKJV)$/i,'.'+version)}else if(['biblegateway.com','www.biblegateway.com'].includes(u.hostname)){u.searchParams.set('version',version)}return u.href}
versionSelect.addEventListener('change',()=>{try{localStorage.setItem('smallgroup-bible-version',versionSelect.value)}catch{}document.querySelectorAll('a[data-scripture-url]').forEach(a=>a.href=versionedUrl(a.dataset.scriptureUrl))});
function links(parent,items){for(const item of items||[]){if(!item.url||!/^https:\/\//i.test(item.url))continue;const a=el('a',item.text||item.reference);a.dataset.scriptureUrl=item.url;a.href=versionedUrl(item.url);a.target='_blank';a.rel='noopener noreferrer';const p=el('div');p.append(a);parent.append(p)}}
function question(q){const li=el('li',typeof q==='string'?q:q.text);links(li,q.scriptureLinks);for(const p of q.readingPrompts||[]){li.append(el('p',p.text));links(li,p.scriptureLinks)}if(q.subquestions?.length){const sub=el('ol');for(const t of q.subquestions)sub.append(question(t));li.append(sub)}return li}
function study(s){const c=el('article',undefined,'card');c.append(el('div',format(s.date),'meta'),el('h3',s.title||s.passage));links(c,s.passages||[{reference:s.passage,url:'https://www.biblegateway.com/passage/?search='+encodeURIComponent(s.passage)}]);for(const intro of s.introduction||[]){c.append(el('h4',intro.heading),el('p',intro.text));links(c,intro.scriptureLinks)}const list=el('ol');for(const q of s.questions||[])list.append(question(q));c.append(list);return c}

const nav=document.getElementById('study-nav'),menu=document.getElementById('menu');
function toggleMenu(open){nav.classList.toggle('open',open);menu.setAttribute('aria-expanded',String(open))}
menu.addEventListener('click',()=>toggleMenu(!nav.classList.contains('open')));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&nav.classList.contains('open')){toggleMenu(false);menu.focus()}});
fetch('./data.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error('Load failed');return r.json()}).then(d=>{
const studies=d.studies.slice().sort((a,b)=>b.date.localeCompare(a.date));
const selected=studies.find(s=>s.date===new URLSearchParams(location.search).get('study'))||studies[0];
for(const s of studies){const a=el('a');a.href='?study='+encodeURIComponent(s.date);a.append(el('span',format(s.date),'nav-date'),el('span',s.title||s.passage));if(s===selected)a.setAttribute('aria-current','page');document.getElementById('study-list').append(a)}
if(selected){document.getElementById('current').append(study(selected));document.title=(selected.title||selected.passage)+' | Weekly Bible Study'}else document.getElementById('current').append(el('p','No studies posted yet.'));
document.getElementById('error').hidden=true;
}).catch(()=>{document.getElementById('error').textContent='Study information could not be loaded. Please try refreshing.'});
</script></body></html>
