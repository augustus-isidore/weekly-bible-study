<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weekly Bible Study Test</title>
<style>
:root{color-scheme:light;--ink:#24342e;--muted:#64736a;--green:#315c49;--paper:#f6f5ef;--line:#dce2d9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.65 system-ui,sans-serif}header{background:#244638;color:white;padding:48px 24px}header div,main,footer{max-width:850px;margin:auto}header p{margin:0;color:#d5e6d9;font-size:13px;letter-spacing:.16em;text-transform:uppercase}h1,h2,h3{line-height:1.2}h1{font:500 clamp(36px,6vw,56px)/1.15 Georgia,serif;margin:12px 0}header span{color:#e3eee5}main{padding:24px}section{margin:24px 0 40px}h2{font:500 30px Georgia,serif;margin:0 0 18px}.card{background:white;border:1px solid var(--line);border-radius:12px;padding:24px;margin:12px 0}h3{margin:6px 0 12px;font-size:22px}.meta{font-size:14px;color:var(--muted)}.event{display:flex;gap:18px;align-items:flex-start}.date{min-width:70px;font-weight:600;color:var(--green)}.event h3{font-size:18px;margin:0}.event p{margin:4px 0}.tentative{font-size:12px;font-weight:600;color:#795615;background:#faf0d5;padding:3px 8px;border-radius:5px;display:inline-block}a{color:var(--green)}ol{padding-left:25px}li{padding-left:4px;margin:12px 0}ol ol{list-style-type:lower-alpha}ol ol li{margin:6px 0}details summary{cursor:pointer;font-weight:600}footer{padding:0 24px 32px;color:var(--muted);font-size:14px}@media(max-width:480px){main{padding:16px}.card{padding:18px}.event{gap:12px}}
</style></head><body><header><div><p>Small group</p><h1>Weekly Bible Study</h1><span>Growing together in faith and understanding.</span></div></header><main><section><h2>Upcoming gatherings</h2><div id="events"></div></section><section><h2>Latest study</h2><div id="latest"></div></section><section id="archive-section" hidden><h2>Past studies</h2><div id="archive"></div></section><p id="error" role="status">Loading study information…</p></main><footer>Weekly Bible Study</footer>
<script>
const el=(tag,txt,cls)=>{const e=document.createElement(tag);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e};
const format=(date,opts)=>new Intl.DateTimeFormat('en-CA',opts||{year:'numeric',month:'long',day:'numeric',timeZone:'UTC'}).format(new Date(date+'T00:00:00Z'));
function study(s){const c=el('article',undefined,'card');c.append(el('div',format(s.date),'meta'),el('h3',s.title||s.passage));const a=el('a',s.passage);a.href='https://www.biblegateway.com/passage/?search='+encodeURIComponent(s.passage);a.target='_blank';a.rel='noopener noreferrer';c.append(a);const list=el('ol');for(const q of s.questions||[]){const li=el('li',q.text);if(q.subquestions?.length){const sub=el('ol');for(const t of q.subquestions)sub.append(el('li',t));li.append(sub)}list.append(li)}c.append(list);return c}
fetch('./data.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw Error('Load failed');return r.json()}).then(d=>{const today=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Toronto',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const iso=['year','month','day'].map(k=>today.find(p=>p.type===k).value).join('-');const events=d.events.filter(e=>e.date>=iso).sort((a,b)=>a.date.localeCompare(b.date));for(const e of events){const c=el('article',undefined,'card event'),b=el('div');b.append(el('h3',e.title),el('p',e.description));if(e.status==='tentative')b.append(el('span','Tentative','tentative'));c.append(el('div',format(e.date,{month:'short',day:'numeric',timeZone:'UTC'}),'date'),b);document.getElementById('events').append(c)}if(!events.length)document.getElementById('events').append(el('p','No upcoming gatherings announced.'));const studies=d.studies.slice().sort((a,b)=>b.date.localeCompare(a.date));if(studies.length)document.getElementById('latest').append(study(studies[0]));else document.getElementById('latest').append(el('p','No studies posted yet.'));for(const s of studies.slice(1)){const det=el('details',undefined,'card');det.append(el('summary',format(s.date)+' — '+s.passage),study(s));document.getElementById('archive').append(det)}document.getElementById('archive-section').hidden=studies.length<2;document.getElementById('error').hidden=true}).catch(()=>{document.getElementById('error').textContent='Study information could not be loaded. Please try refreshing.'});
</script></body></html>
